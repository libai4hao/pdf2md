name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的已有 tag（例如 v0.1.0）"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: test (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest -v

  publish:
    name: publish release
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Resolve tag
        id: meta
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TAG:-}" ]; then TAG="$INPUT_TAG"; else TAG="$REF_NAME"; fi
          case "$TAG" in
            v*) ;;
            *) echo "tag 必须以 v 开头：$TAG" >&2; exit 1 ;;
          esac
          git rev-parse "$TAG^{commit}" >/dev/null
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build source archive
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          git archive --format=zip --prefix="pdf2md-${TAG}/" -o "pdf2md-${TAG}.zip" "$TAG"
          sha256sum "pdf2md-${TAG}.zip" > "pdf2md-${TAG}.zip.sha256"

      - name: Build wheel and sdist
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade build
          python - <<'PY'
          import os, sys, convert
          tag = os.environ["TAG"].lstrip("v")
          if convert.__version__ != tag:
              sys.exit("版本不一致：convert.__version__=%s，tag=%s" % (convert.__version__, tag))
          PY
          python -m build --outdir dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          FILES=("pdf2md-${TAG}.zip" "pdf2md-${TAG}.zip.sha256" dist/*.whl dist/*.tar.gz)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            gh release create "$TAG" "${FILES[@]}" \
              --title "pdf2md ${TAG}" \
              --notes-file CHANGELOG.md
          fi
